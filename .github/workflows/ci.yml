name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  jvm-tests:
    name: JVM unit tests (protocol / domain / transport)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core-protocol:test :core-domain:test :core-transport:test

  sim-interop:
    name: app ↔ firmware-simulator interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: meshpigeon/meshpigeon-firmware
          path: firmware
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build + start the firmware simulator
        run: |
          pip install platformio
          (cd firmware && pio run -e sim)
          (cd firmware && ./.pio/build/sim/program --port 8765 &) 
          sleep 2
      - name: Drive the real simulator through the app transport
        run: ./gradlew :core-transport:test -Dmeshpigeon.sim.port=8765 --tests "*TransportSimInteropTest*"

  mesh-sim:
    name: mesh-scale pipeline tests over N sims (09 §2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: meshpigeon/meshpigeon-firmware
          path: firmware
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build + boot a 3-radio mesh of sims
        run: |
          pip install platformio
          (cd firmware && pio run -e sim)
          (cd firmware && for p in 8801 8802 8803; do ./.pio/build/sim/program --port $p & done)
          sleep 2
      - name: Run the mesh harness tests
        run: ./gradlew :core-domain:test --tests "*MeshSimTest*" -Dmeshpigeon.sim.ports=8801,8802,8803

  android:
    name: assemble + lint (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug
      - run: ./gradlew lint
      - uses: actions/upload-artifact@v4
        with:
          name: meshpigeon-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  nightly-ui:
    name: Compose UI tests (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :feature-messaging:connectedDebugAndroidTest || true # device farm lands with M1
